[project]
name = "iac"
version = "0.1.0"
description = "vLLM for Mac — mlx_lm.server lifecycle manager for local PI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mlx-lm>=0.30.0",
    "mlx>=0.30.4",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
iac = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["main.py"]
