[project]
name = "qubits-cli"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
q = "container_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/container_cli"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.9",
    "mutmut>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
paths_to_mutate = ["src/container_cli/"]
# Run all tests against each mutation, not just coverage-mapped ones.
# Command-module tests mock their dependencies so coverage never maps them
# to the functions they exercise — without this flag those mutations get "no tests".
only_covered_tests = false
