[project]
name = "qubits-cli"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
q = "container_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/container_cli"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.9",
]
