[project]
name = "qubits-cli"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
q = "container_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/container_cli"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-bdd>=8",
    "ruff>=0.9",
    "mutmut>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "tests/acceptance"]
python_files = ["test_*.py", "*_steps.py"]

[tool.mutmut]
paths_to_mutate = ["src/container_cli/"]
# Run all tests against each mutation, not just coverage-mapped ones.
# Command-module tests mock their dependencies so coverage never maps them
# to the functions they exercise — without this flag those mutations get "no tests".
only_covered_tests = false
# CI gate threshold (enforced by `make mutation-ci-threshold`, not by mutmut itself)
# threshold = 70

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "D",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "PTH",
    "ARG",
    "ERA",
    "A",
    "TID",
]
ignore = [
    "D203",
    "D213",
    "D406",
    "D407",
    "D413",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ARG001", "ARG002", "ARG005", "E501"]
"src/container_cli/__init__.py" = ["D104"]
"src/container_cli/commands/__init__.py" = ["D104"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
